<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Lending</title>
  <link rel="stylesheet" href="../style/dashboard.css">
</head>
<body>
  <div class="card">
    <h1>Book Lending System</h1>
    <div class="toggle">
      <button id="userBtn">User</button>
      <button id="adminBtn">Admin</button>
    </div>

    <div id="formContainer">
      <!-- User Section -->
      <div id="userSection" class="section">
        <h2>Welcome, User!</h2>
        <form id="lendBookForm" class="form">
          <h3>Lend a Book</h3>
          <input type="text" placeholder="Enter Book Title" required>
          <button type="submit">Lend Book</button>
        </form>
        <p class="info">Your Lending History will appear here.</p>
      </div>

      <!-- Admin Section -->
      <div id="adminSection" class="section hidden">
        <h2>Welcome, Admin!</h2>
        <form id="addBookForm" class="form">
          <h3>Add a Book</h3>
          <input type="text" placeholder="Enter Book Title" required>
          <input type="text" placeholder="Enter Author Name" required>
          <button type="submit">Add Book</button>
        </form>
        <p class="info">Books added by the admin will be listed here.</p>
      </div>
    </div>
  </div>
  <script src="../script/dashboard.js"></script>
</body>
</html>
